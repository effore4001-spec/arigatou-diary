<title>お母さんありがとう日記</title>
<style>
  /* ===================================================================
     お母さんありがとう日記 — pink / white / gold luxury theme
     =================================================================== */
  :root{
    --bg:#fdf4f7;
    --text:#4a2b38;--ink-soft:#6b4152;--muted:#a0798a;
    --line:rgba(160,90,120,.16);--line2:rgba(160,90,120,.08);
    --panel:#ffffff;--panel2:#fdf7fa;
    /* pink = accent */
    --pink:#e8739e;--pink-bright:#f08cb1;--pink-deep:#d4527f;--pink-soft:#fbe3ec;
    /* gold = frames / luxury */
    --gold:#c9a13a;--gold2:#e8c977;--gold-deep:#b1882c;--gold-soft:#f4e9c8;
    --shadow:0 1px 2px rgba(120,60,90,.06),0 14px 30px rgba(120,60,90,.12),0 40px 80px rgba(120,60,90,.10);
    --shadow-sm:0 1px 2px rgba(120,60,90,.05),0 8px 20px rgba(120,60,90,.08);
    --glow-pink:0 10px 26px rgba(212,82,127,.28);
    --ring:0 0 0 3px rgba(232,115,158,.25);
    --serif:Georgia,"Times New Roman","Yu Mincho","Hiragino Mincho ProN",serif;
    --radius:16px;--radius-sm:10px;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
    background:var(--bg);color:var(--text);
    overscroll-behavior:none;
  }
  button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
  input[type=file]{display:none}

  /* ---------- screens ---------- */
  .screen{display:none;flex-direction:column;position:fixed;inset:0;overflow:hidden}
  .screen.active{display:flex}

  .desk{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding-top:112px}
  .paper-wrap{position:relative}

  /* --- app title over the wooden desk (just above the polaroids) --- */
  .cal-title-top{
    position:absolute;top:calc(var(--safe-top) + 30px);left:0;right:0;z-index:4;
    text-align:center;font-family:var(--serif);pointer-events:none;
  }
  .cal-title-top .small{
    display:block;font-size:12px;letter-spacing:.5em;text-indent:.5em;
    color:var(--gold2);text-shadow:0 1px 6px rgba(25,12,4,.9);margin-bottom:10px;
  }
  .cal-title-top .main{
    font-size:27px;font-weight:600;line-height:1.4;letter-spacing:.16em;text-indent:.16em;
    color:#fff8ef;
    text-shadow:0 1px 3px rgba(25,12,4,.9), 0 3px 14px rgba(25,12,4,.7);
  }

  /* --- plain printed calendar sheet (like the reference photo) --- */
  .cal-paper{
    position:relative;z-index:1;width:min(90vw,450px);
    background:
      url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22300%22%3E%3Cfilter id=%22p%22 x=%220%22 y=%220%22 width=%22100%25%22 height=%22100%25%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.8%22 numOctaves=%222%22 seed=%229%22/%3E%3CfeColorMatrix type=%22luminanceToAlpha%22/%3E%3C/filter%3E%3Crect width=%22300%22 height=%22300%22 filter=%22url(%23p)%22 opacity=%22.04%22/%3E%3C/svg%3E'),
      linear-gradient(180deg,#fbfaf7,#f3f1ec);
    border-radius:1px;
    padding:20px 18px 16px;
    box-shadow:
      0 1px 1px rgba(30,20,10,.18),
      0 4px 10px rgba(30,20,10,.22),
      0 18px 38px rgba(30,20,10,.30);
  }

  .cal-head{display:flex;align-items:flex-start;justify-content:space-between;padding:0 4px 14px}
  .cal-month-block{display:flex;flex-direction:column;line-height:1}
  .cal-month-block .m{font-family:var(--serif);font-size:44px;color:#3c3a36}
  .cal-month-block .me{font-family:var(--serif);font-size:13px;color:#6b6862;margin-top:5px;letter-spacing:.04em}
  .cal-year-block{display:flex;align-items:center;gap:4px;margin-top:6px}
  .cal-year-block .y{font-family:var(--serif);font-size:17px;color:#4a4844;letter-spacing:.08em}
  .cal-nav{
    width:36px;height:36px;border-radius:50%;font-size:19px;color:#8b867e;
    background:transparent;border:none;
  }
  .cal-nav:active{background:rgba(0,0,0,.06)}
  .cal-week{display:grid;grid-template-columns:repeat(7,1fr)}
  .cal-week span{text-align:center;font-family:var(--serif);font-size:9.5px;letter-spacing:.08em;color:#55524c;padding:0 0 7px}
  .cal-week span:first-child{color:#b5342c}
  #cal-grid{
    display:grid;grid-template-columns:repeat(7,1fr);
    border-top:1px solid #c9c5bc;border-left:1px solid #c9c5bc;
  }
  .day{
    position:relative;aspect-ratio:1/1.06;border-radius:0;
    display:block;text-align:left;padding:5px 0 0 7px;
    background:transparent;
    border:none;border-right:1px solid #c9c5bc;border-bottom:1px solid #c9c5bc;
    font-size:13.5px;color:#3c3a36;
  }
  .day .num{font-family:var(--serif)}
  .day:active{background:rgba(232,115,158,.12)}
  .day.sun .num{color:#b5342c}
  /* today: AR-style neon pink hologram frame overlaid on the paper */
  .day.today::after{
    content:"";position:absolute;inset:-2px;z-index:3;pointer-events:none;border-radius:6px;
    border:1.5px solid rgba(255,133,186,.95);
    box-shadow:
      0 0 2px rgba(255,255,255,.9),
      0 0 7px rgba(255,95,162,.95),
      0 0 18px rgba(255,95,162,.65),
      0 0 34px rgba(255,95,162,.40);
    animation:arPulse 2s ease-in-out infinite;
  }
  @keyframes arPulse{0%,100%{opacity:.6}50%{opacity:1}}
  .day .heart{position:absolute;right:4px;bottom:3px;font-size:14px;line-height:1;color:var(--pink)}
  .day .heart.off{visibility:hidden}
  .cal-foot{margin-top:10px;text-align:center;font-size:10px;color:#8b867e;letter-spacing:.08em}

  /* --- polaroid photos hugging the calendar sheet --- */
  .polaroid{
    position:absolute;z-index:2;width:110px;padding:7px 7px 24px;border-radius:2px;
    background:linear-gradient(180deg,#ffffff,#f4efe8);
    box-shadow:0 1px 2px rgba(30,20,10,.25),0 8px 16px rgba(30,20,10,.30);
  }
  .p-inner{
    display:block;position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;
    background:linear-gradient(160deg,#f6e3ec,#efd7e2);
    border:1px solid rgba(120,60,90,.08);
  }
  .p-inner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
  .polaroid.has-image .p-inner img{display:block}
  .p-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--gold)}
  .polaroid.has-image .p-empty{display:none}
  .p-tape{
    position:absolute;top:-9px;left:50%;width:56px;height:18px;z-index:2;
    transform:translateX(-50%) rotate(-2deg);
    background:linear-gradient(180deg,rgba(255,236,244,.55),rgba(248,214,229,.45));
    box-shadow:0 1px 3px rgba(30,20,10,.20);
    clip-path:polygon(3% 10%,7% 0,94% 3%,100% 18%,97% 90%,92% 100%,5% 95%,0 82%);
  }
  .polaroid[data-slot="0"]{top:-118px;left:-2px;transform:rotate(-5deg)}
  .polaroid[data-slot="1"]{top:-128px;right:2px;transform:rotate(4deg);width:118px}
  .polaroid[data-slot="2"]{bottom:-114px;left:6px;transform:rotate(4deg);width:106px}
  .polaroid[data-slot="3"]{bottom:-118px;right:-4px;transform:rotate(-6deg)}

  /* ===================================================================
     screen 3 : diary entry
     =================================================================== */
  #screen-entry{
    background:
      radial-gradient(120% 70% at 100% 0%, rgba(232,201,119,.20), transparent 55%),
      radial-gradient(120% 80% at 0% 100%, rgba(232,115,158,.14), transparent 55%),
      linear-gradient(180deg,#fdf4f7,#fbe9f0);
  }
  .entry-head{
    position:relative;display:flex;align-items:center;justify-content:center;
    padding:calc(var(--safe-top) + 14px) 100px 10px;
  }
  #btn-entry-back{
    position:absolute;left:14px;top:calc(var(--safe-top) + 9px);
    padding:9px 16px;border-radius:999px;font-size:13px;color:var(--pink-deep);
    background:#fff;border:1px solid var(--gold2);box-shadow:var(--shadow-sm);white-space:nowrap;
  }
  #entry-date{
    text-align:center;font-family:var(--serif);font-size:15px;letter-spacing:.06em;color:var(--ink-soft);
    white-space:nowrap;
  }
  .entry-body{flex:1;display:flex;flex-direction:column;min-height:0;padding:4px 18px calc(var(--safe-bottom) + 14px)}

  /* --- upper half : photo (500x500) --- */
  .entry-photo-wrap{flex:0 0 auto;display:flex;justify-content:center;padding:6px 0 14px}
  #entry-photo-frame{
    position:relative;width:min(72vw,34dvh,340px);aspect-ratio:1/1;border-radius:6px;
    background:#fff;padding:10px;
    box-shadow:var(--shadow-sm), inset 0 0 0 1px var(--gold2);
  }
  #entry-photo-inner{
    width:100%;height:100%;border-radius:3px;overflow:hidden;position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    background:var(--pink-soft);
    border:1.5px dashed var(--gold);
  }
  #entry-photo-frame.has-image #entry-photo-inner{border:none;background:#000}
  #entry-photo-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
  #entry-photo-frame.has-image #entry-photo-img{display:block}
  .entry-photo-empty{font-size:34px;line-height:1}
  .entry-photo-hint{font-size:11px;color:var(--muted);letter-spacing:.05em;text-align:center;line-height:1.7}
  #entry-photo-frame.has-image .entry-photo-empty,
  #entry-photo-frame.has-image .entry-photo-hint{display:none}
  #btn-photo-delete{
    position:absolute;top:-10px;right:-10px;width:30px;height:30px;border-radius:50%;
    background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-sm);
    color:var(--pink-deep);font-size:14px;display:none;align-items:center;justify-content:center;z-index:2;
  }
  #entry-photo-frame.has-image #btn-photo-delete{display:flex}

  /* --- lower half : diary text --- */
  .entry-text-wrap{
    flex:1;min-height:0;display:flex;flex-direction:column;
    background:#fff;border-radius:var(--radius);
    box-shadow:var(--shadow-sm), inset 0 0 0 1px var(--gold-soft);
    overflow:hidden;
  }
  #entry-text{
    flex:1;width:100%;resize:none;border:none;outline:none;
    font-family:var(--serif);font-size:16px;line-height:36px;color:var(--text);
    padding:16px 18px 10px;
    /* ruled lines: one hairline at the bottom of each 36px line box
       (background-position offsets the pattern by the top padding) */
    background:
      repeating-linear-gradient(180deg, transparent 0 35px, var(--line2) 35px 36px);
    background-position:0 16px;
    background-attachment:local;
  }
  #entry-text::placeholder{color:#cfa8ba}
  .entry-actions{display:flex;justify-content:center;padding:14px 0 2px}
  #btn-entry-save{
    min-width:210px;padding:15px 30px;border-radius:999px;
    font-family:var(--serif);font-size:16px;letter-spacing:.22em;text-indent:.22em;color:#fff;
    background:linear-gradient(180deg,var(--pink-bright),var(--pink-deep));
    border:1px solid var(--gold2);
    box-shadow:var(--glow-pink), inset 0 1px 0 rgba(255,255,255,.45);
    transition:transform .12s ease;
  }
  #btn-entry-save:active{transform:scale(.96)}

  /* ---------- toast ---------- */
  #toast{
    position:fixed;left:50%;bottom:calc(var(--safe-bottom) + 96px);transform:translateX(-50%) translateY(12px);
    padding:12px 26px;border-radius:999px;z-index:50;
    background:rgba(74,43,56,.92);color:#fff;font-size:14px;letter-spacing:.08em;white-space:nowrap;
    border:1px solid var(--gold2);box-shadow:var(--shadow-sm);
    opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- =============== screen 2 : calendar =============== -->
<section id="screen-calendar" class="screen active">
  <header class="cal-title-top">
    <span class="small">THANK YOU, MOM</span>
    <span class="main">お母さん<br>ありがとう日記</span>
  </header>
  <div class="desk">
  <div class="paper-wrap">
  <button class="polaroid" data-slot="0" title="写真を飾る"><span class="p-tape"></span><span class="p-inner"><img alt=""><span class="p-empty">＋</span></span></button>
  <button class="polaroid" data-slot="1" title="写真を飾る"><span class="p-tape"></span><span class="p-inner"><img alt=""><span class="p-empty">＋</span></span></button>
  <button class="polaroid" data-slot="2" title="写真を飾る"><span class="p-tape"></span><span class="p-inner"><img alt=""><span class="p-empty">＋</span></span></button>
  <button class="polaroid" data-slot="3" title="写真を飾る"><span class="p-tape"></span><span class="p-inner"><img alt=""><span class="p-empty">＋</span></span></button>
  <div class="cal-paper">
    <div class="cal-head">
      <div class="cal-month-block">
        <span class="m" id="cal-month">7</span>
        <span class="me" id="cal-month-en">July</span>
      </div>
      <div class="cal-year-block">
        <button class="cal-nav" id="btn-prev-month">‹</button>
        <span class="y" id="cal-year">2026</span>
        <button class="cal-nav" id="btn-next-month">›</button>
      </div>
    </div>
    <div class="cal-week">
      <span>SUN</span><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span>
    </div>
    <div id="cal-grid"></div>
    <p class="cal-foot">♥ のある日は日記を書いた日</p>
  </div>
  </div>
  </div>
</section>

<!-- =============== screen 3 : entry =============== -->
<section id="screen-entry" class="screen">
  <header class="entry-head">
    <button id="btn-entry-back">‹ 戻る</button>
    <h2 id="entry-date">2026年7月4日（土）</h2>
  </header>
  <div class="entry-body">
    <div class="entry-photo-wrap">
      <div id="entry-photo-frame">
        <button id="btn-photo-delete" title="写真を削除">✕</button>
        <div id="entry-photo-inner">
          <img id="entry-photo-img" alt="">
          <span class="entry-photo-empty">📷</span>
          <span class="entry-photo-hint">タップして写真を追加<br>（500×500で保存されます）</span>
        </div>
      </div>
    </div>
    <div class="entry-text-wrap">
      <textarea id="entry-text" placeholder="今日のありがとうを書きましょう"></textarea>
    </div>
    <div class="entry-actions">
      <button id="btn-entry-save">保存する ♡</button>
    </div>
  </div>
</section>

<input type="file" id="input-entry-photo" accept="image/*">
<input type="file" id="input-desk-photo" accept="image/*">
<div id="toast"></div>

<script>
'use strict';
/* ===================================================================
   IndexedDB
   =================================================================== */
const DB_NAME = 'mom-thanks-diary';
let db = null;

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const d = req.result;
      if(!d.objectStoreNames.contains('entries'))  d.createObjectStore('entries');
      if(!d.objectStoreNames.contains('settings')) d.createObjectStore('settings');
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror   = () => reject(req.error);
  });
}
function dbReq(store, mode, fn){
  return new Promise((resolve, reject) => {
    const t = db.transaction(store, mode);
    const r = fn(t.objectStore(store));
    r.onsuccess = () => resolve(r.result);
    r.onerror   = () => reject(r.error);
  });
}
const dbGet  = (store, key)      => dbReq(store, 'readonly',  s => s.get(key));
const dbPut  = (store, key, val) => dbReq(store, 'readwrite', s => s.put(val, key));
const dbDel  = (store, key)      => dbReq(store, 'readwrite', s => s.delete(key));
const dbKeys = (store)           => dbReq(store, 'readonly',  s => s.getAllKeys());

/* ===================================================================
   utilities
   =================================================================== */
const $ = id => document.getElementById(id);
const WEEKDAYS = ['日','月','火','水','木','金','土'];

function dateKey(y, m, d){  // m: 0-11
  return `${y}-${String(m + 1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function formatDateJa(key){
  const [y, m, d] = key.split('-').map(Number);
  const w = WEEKDAYS[new Date(y, m - 1, d).getDay()];
  return `${y}年${m}月${d}日（${w}）`;
}

let toastTimer = null;
function toast(msg){
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
}

function loadImageFromFile(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload  = () => resolve({ img, url });
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('画像を読み込めませんでした')); };
    img.src = url;
  });
}
function canvasToJpeg(canvas){
  return new Promise((resolve, reject) => {
    canvas.toBlob(b => b ? resolve(b) : reject(new Error('画像の変換に失敗しました')), 'image/jpeg', 0.85);
  });
}
/* center-crop to a 500x500 square (diary photos) */
async function toSquareBlob(file, size = 500){
  const { img, url } = await loadImageFromFile(file);
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const s  = Math.min(img.naturalWidth, img.naturalHeight);
  const sx = (img.naturalWidth  - s) / 2;
  const sy = (img.naturalHeight - s) / 2;
  c.getContext('2d').drawImage(img, sx, sy, s, s, 0, 0, size, size);
  URL.revokeObjectURL(url);
  return canvasToJpeg(c);
}
/* ===================================================================
   screen 2 : calendar
   =================================================================== */
let calYear, calMonth;   // month: 0-11

const MONTH_EN = ['January','February','March','April','May','June',
                  'July','August','September','October','November','December'];

async function renderCalendar(){
  $('cal-year').textContent     = calYear;
  $('cal-month').textContent    = calMonth + 1;
  $('cal-month-en').textContent = MONTH_EN[calMonth];

  const keys = new Set(await dbKeys('entries'));
  const grid = $('cal-grid');
  grid.innerHTML = '';

  const firstDay   = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const today = new Date();
  const todayKey = dateKey(today.getFullYear(), today.getMonth(), today.getDate());

  for(let i = 0; i < firstDay; i++){
    const b = document.createElement('div');
    b.className = 'day blank';
    grid.appendChild(b);
  }
  for(let d = 1; d <= daysInMonth; d++){
    const key = dateKey(calYear, calMonth, d);
    const dow = (firstDay + d - 1) % 7;
    const btn = document.createElement('button');
    btn.className = 'day' + (dow === 0 ? ' sun' : '') + (dow === 6 ? ' sat' : '') + (key === todayKey ? ' today' : '');
    btn.innerHTML = `<span class="num">${d}</span><span class="heart${keys.has(key) ? '' : ' off'}">♥</span>`;
    btn.addEventListener('click', () => openEntry(key));
    grid.appendChild(btn);
  }
  // trailing blanks so the printed grid is a complete rectangle
  const trailing = (7 - (firstDay + daysInMonth) % 7) % 7;
  for(let i = 0; i < trailing; i++){
    const b = document.createElement('div');
    b.className = 'day blank';
    grid.appendChild(b);
  }
}

/* --- scattered polaroid photos on the desk --- */
let deskSlot = null;
const deskUrls = [null, null, null, null];

async function renderDeskPhotos(){
  for(let i = 0; i < 4; i++){
    const el  = document.querySelector(`.polaroid[data-slot="${i}"]`);
    const img = el.querySelector('img');
    const blob = await dbGet('settings', 'deskPhoto' + i);
    if(deskUrls[i]){ URL.revokeObjectURL(deskUrls[i]); deskUrls[i] = null; }
    if(blob){
      deskUrls[i] = URL.createObjectURL(blob);
      img.src = deskUrls[i];
      el.classList.add('has-image');
    }else{
      img.removeAttribute('src');
      el.classList.remove('has-image');
    }
  }
}
document.querySelectorAll('.polaroid').forEach(el => {
  el.addEventListener('click', () => {
    deskSlot = Number(el.dataset.slot);
    $('input-desk-photo').click();
  });
});
$('input-desk-photo').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if(!file || deskSlot === null) return;
  try{
    const blob = await toSquareBlob(file, 500);
    await dbPut('settings', 'deskPhoto' + deskSlot, blob);
    await renderDeskPhotos();
    toast('写真を飾りました ♡');
  }catch(err){
    toast('写真を読み込めませんでした');
  }
});

$('btn-prev-month').addEventListener('click', () => {
  calMonth--; if(calMonth < 0){ calMonth = 11; calYear--; }
  renderCalendar();
});
$('btn-next-month').addEventListener('click', () => {
  calMonth++; if(calMonth > 11){ calMonth = 0; calYear++; }
  renderCalendar();
});

/* ===================================================================
   screen 3 : entry
   =================================================================== */
let currentKey     = null;
let entryImageBlob = null;
let entryPhotoUrl  = null;
let entryDirty     = false;

function setEntryImage(blob){
  entryImageBlob = blob;
  const frame = $('entry-photo-frame');
  const img   = $('entry-photo-img');
  if(entryPhotoUrl){ URL.revokeObjectURL(entryPhotoUrl); entryPhotoUrl = null; }
  if(blob){
    entryPhotoUrl = URL.createObjectURL(blob);
    img.src = entryPhotoUrl;
    frame.classList.add('has-image');
  }else{
    img.removeAttribute('src');
    frame.classList.remove('has-image');
  }
}

async function openEntry(key){
  currentKey = key;
  $('entry-date').textContent = formatDateJa(key);
  const rec = await dbGet('entries', key);
  $('entry-text').value = rec ? (rec.text || '') : '';
  setEntryImage(rec ? (rec.image || null) : null);
  entryDirty = false;
  showScreen('screen-entry');
}

async function saveEntry(){
  const text = $('entry-text').value.trim();
  if(!text && !entryImageBlob){
    await dbDel('entries', currentKey);   // empty entry = no record (no heart mark)
  }else{
    await dbPut('entries', currentKey, {
      date: currentKey,
      text,
      image: entryImageBlob,
      updatedAt: Date.now(),
    });
  }
  entryDirty = false;
}

$('entry-photo-inner').addEventListener('click', () => $('input-entry-photo').click());
$('input-entry-photo').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  try{
    const blob = await toSquareBlob(file, 500);
    setEntryImage(blob);
    entryDirty = true;
  }catch(err){
    toast('写真を読み込めませんでした');
  }
});
$('btn-photo-delete').addEventListener('click', e => {
  e.stopPropagation();
  if(!confirm('この日の写真を削除しますか？')) return;
  setEntryImage(null);
  entryDirty = true;
});
$('entry-text').addEventListener('input', () => { entryDirty = true; });

$('btn-entry-save').addEventListener('click', async () => {
  await saveEntry();
  toast('保存しました ♡');
});
$('btn-entry-back').addEventListener('click', async () => {
  if(entryDirty) await saveEntry();   // silent auto-save
  await renderCalendar();
  showScreen('screen-calendar');
});

/* ===================================================================
   init
   =================================================================== */
(async function init(){
  db = await openDB();
  const now = new Date();
  calYear = now.getFullYear(); calMonth = now.getMonth();
  await renderCalendar();
  await renderDeskPhotos();
  showScreen('screen-calendar');
})().catch(err => {
  alert('起動に失敗しました: ' + err.message);
});
</script>
<script>
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
